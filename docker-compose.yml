services:
  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      BINANCE_BASE_URL: https://api.binance.com/api/v3/klines
      BINANCE_MARKET_TYPE: spot
      SCAN_SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT,DOGEUSDT,AVAXUSDT
      ENTRY_TIMEFRAME: 1h
      HIGHER_TIMEFRAME: 4h
      SETUP_SCORE_THRESHOLD: 60
      ATR_MIN_THRESHOLD: 0.002
      MAX_DISTANCE_TO_LIQUIDITY_ATR: 1.5
      MIN_BODY_RATIO: 0.5
      RISK_PER_TRADE: 0.01
      MIN_RR: 2.0
      ACCOUNT_BALANCE_REFERENCE: 1000
      DATA_STORAGE_PATH: /app/data
    volumes:
      - ./data:/app/data

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/frontend:/usr/share/nginx/html:ro

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trading_signals
      POSTGRES_USER: trading_signals
      POSTGRES_PASSWORD: trading_signals
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
