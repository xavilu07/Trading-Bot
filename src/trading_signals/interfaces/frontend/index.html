<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trading Signals</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #2f81f7;
        --good: #238636;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #1f2a38 0%, var(--bg) 45%);
        color: var(--text);
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 48px 20px 64px;
      }
      .hero {
        margin-bottom: 28px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 42px;
      }
      p {
        color: var(--muted);
      }
      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }
      .card {
        background: color-mix(in srgb, var(--panel) 92%, black);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
      }
      .pill {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(35, 134, 54, 0.2);
        color: #7ee787;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      pre {
        overflow: auto;
        background: #0b0f14;
        border-radius: 12px;
        padding: 14px;
        border: 1px solid var(--border);
        color: #c9d1d9;
      }
      button {
        margin-top: 12px;
        background: var(--accent);
        border: 0;
        color: white;
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.08);
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="hero">
        <span class="pill">Signal Engine</span>
        <h1>Trading Signals Control Room</h1>
        <p>Frontend mínimo para validar salud del backend y consultar señales persistidas.</p>
      </section>

      <section class="grid">
        <article class="card">
          <h2>Health</h2>
          <pre id="health">Cargando...</pre>
        </article>
        <article class="card">
          <h2>Últimas señales</h2>
          <pre id="signals">Cargando...</pre>
          <button id="refresh">Refrescar</button>
        </article>
      </section>
    </main>

    <script>
      async function loadHealth() {
        const response = await fetch("/health");
        const data = await response.json();
        document.getElementById("health").textContent = JSON.stringify(data, null, 2);
      }

      async function loadSignals() {
        const response = await fetch("/v1/signals/latest");
        const data = await response.json();
        document.getElementById("signals").textContent = JSON.stringify(data, null, 2);
      }

      document.getElementById("refresh").addEventListener("click", loadSignals);
      loadHealth();
      loadSignals();
    </script>
  </body>
</html>
